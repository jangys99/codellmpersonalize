#BASE_TASK_CONFIG_PATH: "cos_eor/configs/base/rearrangement_gibson.yaml"

BASE_TASK_CONFIG:
  ENVIRONMENT:
    MAX_EPISODE_STEPS: 1000

  SIMULATOR:
    TYPE: "ExploreSim-v0"
    OBJ_LOAD_TYPE: "non-art" # change to "art" to load URDFs
    TURN_ANGLE: 10
    TILT_ANGLE: 10 # this is the look-up / look-down angle
    INITIAL_LOOK_DOWN_ANGLE: 30
    ACTION_SPACE_CONFIG: "CosRearrangementActions-v0"
    AGENT_0:
      SENSORS: ["RGB_SENSOR", "DEPTH_SENSOR", "SEMANTIC_SENSOR"]
      HEIGHT: 1.5
      RADIUS: 0.18
      MAX_CLIMB: 0.1
    HABITAT_SIM_V0:
      GPU_DEVICE_ID: 0
      ALLOW_SLIDING: True
      ENABLE_PHYSICS: True
      PHYSICS_CONFIG_FILE: "./data/default.physics_config.json"
    RGB_SENSOR:
      WIDTH: 128
      HEIGHT: 128
      HFOV: 90
      POSITION: [0, 1.5, 0]
    SEMANTIC_SENSOR:
      WIDTH: 128
      HEIGHT: 128
      HFOV: 90
      POSITION: [0, 1.5, 0]
    # added only by debug argument, when running
    RGB_SENSOR_3RD_PERSON:
      WIDTH: 512
      HEIGHT: 512
      HFOV: 90
      POSITION: [0, 1.5, 0.88]
    DEPTH_SENSOR:
      WIDTH: 128
      HEIGHT: 128
      HFOV: 90
      MIN_DEPTH: 0.5
      MAX_DEPTH: 5.0
      POSITION: [0, 1.5, 0]
    OCCUPANCY_MAPS:
      MAP_SCALE: 0.05
      MAP_SIZE: 128
      MAX_DEPTH: 3
      SMALL_MAP_RANGE: 20
      LARGE_MAP_RANGE: 100
      HEIGHT_LOWER: 0.15
      HEIGHT_UPPER: 1.5
      GET_PROJ_LOC_MAP: False
      USE_GT_OCC_MAP: False
      MEASURE_NOISE_FREE_AREA: False
      COVERAGE_NOVELTY_POOLING: "mean"
      GET_HIGHRES_LOC_MAP: False
    FINE_OCC_SENSOR:
      WIDTH: 128
      HEIGHT: 128
    COARSE_OCC_SENSOR:
      WIDTH: 128
      HEIGHT: 128
    HIGHRES_COARSE_OCC_SENSOR:
      WIDTH: 256
      HEIGHT: 256
    OBJECT_ANNOTATIONS:
      IS_AVAILABLE: False
      PATH: "./"
    ENABLE_ODOMETRY_NOISE: False
    ODOMETER_NOISE_SCALING: 0.0
    NAVMESH: "navmesh/{scene}_{num_objs}_approx.navmesh"